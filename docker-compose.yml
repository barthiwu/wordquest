version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: wordquest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wordquest
      POSTGRES_PASSWORD: wordquest
      POSTGRES_DB: wordquest
    ports:
      - "5432:5432"
    volumes:
      - wordquest_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wordquest"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: wordquest-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - wordquest_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  wordquest_pg_data:
  wordquest_redis_data:
