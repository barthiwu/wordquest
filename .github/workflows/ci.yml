name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend (lint, typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wordquest
          POSTGRES_PASSWORD: wordquest
          POSTGRES_DB: wordquest_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wordquest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx prisma generate
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://wordquest:wordquest@localhost:5432/wordquest_test
      - run: npm run test
        env:
          DATABASE_URL: postgresql://wordquest:wordquest@localhost:5432/wordquest_test
      - run: npx prisma db seed
        env:
          DATABASE_URL: postgresql://wordquest:wordquest@localhost:5432/wordquest_test
      # e2e hits real HTTP routes end to end (auth, quests, boss battle),
      # so it needs the seed data above plus real (CI-only, throwaway)
      # JWT secrets — everything else in AppConfig is optional and the
      # AI/Azure/email/storage-backed stages are out of scope for e2e on
      # purpose (see test/quests.e2e-spec.ts's doc comment: those need
      # live provider credentials CI doesn't have and never should).
      - run: npm run test:e2e
        env:
          DATABASE_URL: postgresql://wordquest:wordquest@localhost:5432/wordquest_test
          JWT_ACCESS_SECRET: ci-only-access-secret-not-a-real-secret
          JWT_REFRESH_SECRET: ci-only-refresh-secret-not-a-real-secret

  mobile:
    name: Mobile (lint, typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
