name: Deploy (backend)

# V19 Stabilization Pass §14: WordQuest's chosen hosting target is
# Railway — managed Postgres with built-in daily volume backups + PITR,
# usage-based pricing appropriate for beta scale, and no VPC/IAM/ECS
# surface to misconfigure. See docs/DEPLOYMENT.md for the full setup
# (Railway project/service creation, env vars, backup/restore runbook).
#
# What's wired up and will genuinely run once this workflow's secrets
# are set:
#   1. Build the backend's Dockerfile and push it to GitHub Container
#      Registry (ghcr.io) — needs no secrets beyond the automatic
#      GITHUB_TOKEN. This image is NOT what Railway deploys (Railway
#      builds independently from the same Dockerfile — see the `deploy`
#      job below); ghcr.io's copy exists as a versioned, pull-able audit
#      trail / manual-rollback reference, tagged by both short SHA and
#      `latest`.
#   2. Run `prisma migrate deploy` against `STAGING_DATABASE_URL` — the
#      REAL migration command (see backend/README.md's "Schema changes
#      and migrations" section). GitHub's runners aren't on Railway's
#      private network, so this has to be the Postgres service's PUBLIC
#      connection string (Postgres service -> Connect tab -> "Public
#      Network").
#   3. Deploy the backend service on Railway via the CLI, authenticated
#      with a Railway PROJECT token (`RAILWAY_TOKEN`).
#
# Naming note (Barth, Sept 2026): this Railway project has exactly one
# environment, and Railway itself calls it "production" — there's no
# separate Railway "staging" environment to point at. Rather than
# auto-deploying on every tag push straight into something named
# production, this pipeline still treats it as the cautious/staging
# tier: the GitHub side (the secrets below, this job's `environment:`)
# stays named "staging" on purpose, but `railway up`'s `--environment`
# flag below has to say `production`, because that's Railway's actual
# name for the only environment that exists. A true second Railway
# environment (and a real "production" pipeline gated behind manual
# approval, per docs/DEPLOYMENT.md step 7) is future work, not done
# here.
#
# `STAGING_DATABASE_URL`, `RAILWAY_TOKEN`, and `RAILWAY_SERVICE` are
# GitHub Environment secrets on the "staging" GitHub Environment — set
# them there (Settings -> Environments -> staging) before this runs.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/${{ github.repository }}/backend

jobs:
  build-and-push:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "image_tag=${{ env.IMAGE }}:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: backend
          push: true
          tags: |
            ${{ steps.meta.outputs.image_tag }}
            ${{ env.IMAGE }}:latest

  migrate-staging:
    name: Run migrations against staging
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: staging
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # This is the real command (see backend/README.md) — non-
      # interactive, applies only pending migrations, safe to run every
      # deploy. It needs a STAGING_DATABASE_URL secret configured on
      # the "staging" GitHub Environment before this job can succeed.
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

  deploy:
    name: Deploy to Railway (staging)
    runs-on: ubuntu-latest
    needs: migrate-staging
    environment: staging
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # Railway builds independently from backend/Dockerfile on its own
      # infrastructure (Root Directory = "backend" on the service, set
      # once in the Railway dashboard or via .railway/railway.ts — see
      # docs/DEPLOYMENT.md) — `railway up` uploads this checkout and
      # triggers that build. It does NOT pull the ghcr.io image built
      # above; that image is a separate, versioned audit/rollback
      # artifact, not Railway's deploy source.
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      # -c/--ci streams build logs and exits once the build completes
      # rather than tailing the running service's logs forever, which is
      # what a CI job needs. RAILWAY_TOKEN is a project token scoped to
      # the "staging" environment (see docs/DEPLOYMENT.md) — the CLI
      # picks it up from the environment automatically, no `railway
      # login`/`railway link` needed in a non-interactive runner.
      - name: Deploy backend service
        # --environment names Railway's own environment (see the header
        # comment above) -- "production" is correct here even though this
        # job and its secrets live under GitHub's "staging" Environment.
        run: railway up --service "$RAILWAY_SERVICE" --environment production --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE }}
